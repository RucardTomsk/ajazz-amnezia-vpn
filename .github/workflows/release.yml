name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Test
        shell: powershell
        run: ./scripts/test.ps1
      - name: Validate version and package
        run: node scripts/check-package.js
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag' }
          gh release create $tag dist/AmneziaVPN-AJAZZ.zip dist/SHA256SUMS.txt --verify-tag --draft --title "Amnezia VPN for AJAZZ $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
