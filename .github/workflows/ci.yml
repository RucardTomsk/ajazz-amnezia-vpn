name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build from locked sources
        shell: powershell
        run: ./scripts/build.ps1
      - name: Test without a live VPN
        shell: powershell
        run: ./scripts/test.ps1
      - name: Verify distributable
        run: node scripts/check-package.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-node-${{ matrix.node }}
          path: |
            dist/AmneziaVPN-AJAZZ.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
